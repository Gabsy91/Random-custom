    <div class="a-card" id="a-k171"><img src="assets/final/card_171.png" alt="" /><div class="a-ring"></div></div>
    <div class="a-card" id="a-k157"><img src="assets/final/card_157.png" alt="" /><div class="a-ring" id="a-ring157"></div></div>

      <span class="a-dig"><span class="a-strip" id="a-d3"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span></span>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const S = 2.2051; // site css px -> phone screen px
      // phone-frame positions of the 4 result cards (site grid: default order 164 | 157 / 178 | 171)
      const PH = { x0: 110 + 22 * S, x1: 110 + 200 * S, y0: 484 + 376.6 * S, y1: 484 + 706.5 * S, s: S / 3 };
      // full-frame slots (scale 0.85)
      const K = 0.8, SL = [[120, 540], [545, 540], [120, 1328], [545, 1328]];
      const start = { "#a-k164": [PH.x0, PH.y0], "#a-k157": [PH.x1, PH.y0], "#a-k178": [PH.x0, PH.y1], "#a-k171": [PH.x1, PH.y1] };
      const before = { "#a-k164": 0, "#a-k157": 1, "#a-k178": 2, "#a-k171": 3 };
      const after = { "#a-k157": 0, "#a-k164": 1, "#a-k171": 2, "#a-k178": 3 };

      // ---------- initial states ----------
      Object.entries(start).forEach(([id, [x, y]]) => tl.set(id, { x, y, scale: PH.s }, 0));
      tl.set("#a-chip", { x: 110 + 130.5 * S, y: 484 + 192.6 * S, scale: PH.s }, 0);
      tl.set("#a-d2", { y: -7 * 150 }, 0);
      tl.set("#a-d3", { y: -8 * 150 }, 0);

      // ---------- 0.00 reveal: the search bar becomes the app ----------
      tl.fromTo("#a-reveal", { clipPath: "inset(607.5px 158.5px 1215.5px 158.5px round 48.5px)" },
        { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.62, ease: "power3.out" }, 0.02);
      tl.fromTo("#a-phone", { scale: 1.04, transformOrigin: "50% 11%" }, { scale: 1, duration: 0.7, ease: "expo.out" }, 0.02);

      // captions (VO: "Sur Niche Counter, tapez son nom : tous les vendeurs, côte à côte.")
      tl.fromTo("#a-c1 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power2.out" }, 0.28);
      tl.fromTo("#a-c2 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power2.out" }, 0.62);
      tl.to(["#a-c1", "#a-c2"], { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 2.22);
      tl.fromTo("#a-c3 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power2.out" }, 2.36);
      tl.to("#a-c3", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 4.3);

      // ---------- 0.75 camera pushes to the search bar, tap, type ----------
      tl.fromTo("#a-cam", { x: 0, y: 0, scale: 1 }, { x: -135, y: -120, scale: 1.25, duration: 0.5, ease: "power2.inOut" }, 0.72);
      tl.fromTo("#a-tap1", { opacity: 0, scale: 0.82 }, { opacity: 0.75, scale: 1, duration: 0.12, ease: "power2.out" }, 0.8);
      tl.to("#a-tap1", { scale: 0.78, duration: 0.08, ease: "power4.in" }, 0.92);
      tl.to("#a-tap1", { opacity: 0, scale: 1.04, y: -30, duration: 0.2, ease: "power2.in" }, 1.0);
      tl.set("#a-ring", { opacity: 1 }, 1.0);
      for (let i = 0; i < 6; i++) tl.set("#a-caret", { opacity: i % 2 ? 0 : 1 }, 1.0 + i * 0.27);
      tl.set("#a-caret", { opacity: 1 }, 1.55);
      document.querySelectorAll("#a-typed span").forEach((el, i) => tl.set(el, { display: "inline" }, 1.55 + i * 0.058));
      tl.set("#a-caret", { opacity: 0 }, 2.38);

      // ---------- 2.38 enter -> results page (page load: quick blur swap), camera pulls back ----------
      tl.fromTo("#a-results", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, 2.4);
      tl.set("#a-bar", { opacity: 0 }, 2.54);
      tl.to("#a-cam", { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power2.inOut" }, 2.45);

      // ---------- 3.75 the four real offers are carried out of the phone ----------
      tl.set([".a-card", "#a-chip"], { opacity: 1 }, 3.74);
      tl.to("#a-phone", { y: 520, opacity: 0, filter: "blur(10px)", duration: 0.42, ease: "power3.in" }, 3.8);
      Object.keys(before).forEach((id, i) => {
        const [x, y] = SL[before[id]];
        tl.to(id, { x, y, scale: K, duration: 0.55, ease: "power3.inOut" }, 3.78 + i * 0.04);
      });
      tl.to("#a-chip", { x: 600, y: 296, scale: 0.75, duration: 0.55, ease: "power3.inOut" }, 3.76);

      // ---------- 4.3 tap "Prix croissant" -> the site re-sorts ----------
      tl.fromTo("#a-tap2", { opacity: 0, scale: 0.82 }, { opacity: 0.75, scale: 1, duration: 0.1, ease: "power2.out" }, 4.3);
      tl.to("#a-tap2", { scale: 0.78, duration: 0.08, ease: "power4.in" }, 4.4);
      tl.to("#a-tap2", { opacity: 0, scale: 1.04, y: -30, duration: 0.2, ease: "power2.in" }, 4.48);
      tl.to("#a-chip", { scale: 0.71, duration: 0.08, ease: "power4.in" }, 4.4);
      tl.set("#a-chip-on", { opacity: 1 }, 4.48);
      tl.to("#a-chip", { scale: 0.75, duration: 0.3, ease: "back.out(1.7)" }, 4.48);
      tl.set("#a-k157", { zIndex: 5 }, 4.5);
      Object.keys(after).forEach((id) => {
        const [x, y] = SL[after[id]];
        const lead = id === "#a-k157" || id === "#a-k171";
        tl.to(id, { x, y, duration: 0.56, ease: "power3.inOut" }, 4.52);
        tl.to(id, { keyframes: [{ scale: lead ? K * 1.06 : K * 0.92, duration: 0.28, ease: "power2.out" }, { scale: K, duration: 0.28, ease: "power2.in" }] }, 4.52);
      });

      // ---------- 5.05 best offer leads: highlight + counter rolls down ----------
      tl.to(["#a-k164", "#a-k178", "#a-k171"], { opacity: 0.4, duration: 0.3, ease: "power2.out" }, 5.08);
      tl.fromTo("#a-ring157", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 5.08);
      tl.fromTo(["#a-best-label", "#a-count"], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 4.98);
      tl.to("#a-d2", { y: -5 * 150, duration: 0.85, ease: "power3.out" }, 5.04);
      tl.to("#a-d3", { y: -7 * 150, duration: 0.85, ease: "power3.out" }, 5.0);
      tl.fromTo("#a-pill", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.5)" }, 5.97);

      // ---------- 7.2 zoom through the best offer into its product page ----------
      tl.to(["#a-k164", "#a-k178", "#a-k171", "#a-chip", "#a-best-label", "#a-count", "#a-pill"], { opacity: 0, filter: "blur(14px)", duration: 0.26, ease: "power2.in" }, 7.2);
      tl.to("#a-k157", { x: -560, y: -980, scale: 3.6, duration: 0.55, ease: "power3.in" }, 7.2);
      tl.to("#a-dim", { opacity: 1, duration: 0.2, ease: "power2.in" }, 7.55);
      window.__timelines = window.__timelines || {};
      window.__timelines["app"] = tl;
    })();
  </script>
